services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8081}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins_network
    mem_limit: 2g
    cpus: "1.0"
    shm_size: 256m

volumes:
  jenkins_home:

networks:
  jenkins_network:
    driver: bridge